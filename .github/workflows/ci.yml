name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: test / typecheck / build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Windows is in the matrix because Windows-specific bugs have actually
      # happened (see issue #6). Both OSes are reported even if one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests are TypeScript and run directly on Node (native type stripping).
      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # lib/ is committed so that `dsh plugin add github:AliceSaikawa/cache-sentinel`
      # gets a loadable package without building (issue #14). Fail when a fresh
      # build of src/ differs from the committed lib/ (changed or new files).
      - name: Check that the committed lib/ matches the build
        shell: bash
        run: |
          changes=$(git status --porcelain -- lib)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff --stat -- lib
            echo "lib/ is out of date: run 'pnpm run build' and commit lib/" >&2
            exit 1
          fi
