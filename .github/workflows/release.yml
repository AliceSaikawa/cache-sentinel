name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and attach cache-sentinel.tgz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job needs to write: it creates the Release and uploads the asset.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the source of truth for the release, so a mismatch means the
      # published tarball would not match the tag it is attached to.
      - name: Check the tag against package.json
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # The asset name is fixed because the README installs from
      # releases/latest/download/cache-sentinel.tgz.
      - name: Pack
        run: pnpm pack --out cache-sentinel.tgz

      # `gh release create` fails if a Release for the tag already exists, so a
      # published asset is never overwritten.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cache-sentinel.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
